name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Run offline tests
        run: python -m pytest -q

  packaging:
    name: Every skill packages and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build all skill packages
        run: python scripts/package_skills.py
      - name: Install every skill into a scratch folder
        run: python scripts/install_skills.py --target "$RUNNER_TEMP/skills"
      - name: Run an installed skill from outside the repo
        run: |
          cd "$RUNNER_TEMP"
          python skills/position-sizer/scripts/position_sizer.py --instrument cash --account 100000 --entry 155 --stop 148.5 | grep '"units": "153"'
